# GuardRail: client authentication for PostgreSQL.
#
# This is the image's own generated pg_hba.conf with ONE line changed: the
# catch-all at the bottom is hostssl, not host.
#
# WHY THAT ONE LINE MATTERS
#
# ssl=on only OFFERS TLS. It does not require it: a client that asks for
# sslmode=disable is still served plaintext, and gets the whole session in the
# clear — sealed ciphertext with the wrapped DEKs beside it, Argon2id password
# hashes, the audit chain, the session timeline, and the application role's own
# password during connection setup. Anything that could join the data network and
# had the password could simply decline encryption and read all of it.
#
# hostssl is what closes that. A non-TLS connection from the network now matches
# no rule at all and is refused outright, so the encryption is a property of the
# server rather than a request the client is trusted to make.
#
# WHAT IS DELIBERATELY LEFT ALONE
#
# The local socket and the container's own loopback stay `trust`, exactly as the
# image ships them. The healthcheck (pg_isready), the entrypoint's own
# initialisation, `docker compose exec postgres psql` and the documented pg_dump
# backup all arrive that way, and none of them can supply a password. This grants
# nothing new: reaching the socket already means being inside the container.
#
# Connections through the published port do NOT land here. Docker forwards them
# from the bridge, so they arrive with a network source address, match the
# hostssl line, and must present TLS like anything else.
#
# HOW IT IS SELECTED
#
# Only when a certificate exists. install.sh (enable_tls_flags) sets
# GUARDRAIL_PG_HBA to this file in the same branch that turns ssl on, so a
# deployment without a certificate keeps the image's default file and its
# plaintext rule — which is what lets an update driven by an older install.sh
# come up at all. Requiring TLS that the server cannot speak would lock every
# client out of the database, which is a worse outcome than the plaintext it was
# meant to prevent.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# The network. TLS is not optional here.
hostssl all             all             all                     scram-sha-256
