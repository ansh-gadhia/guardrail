# golangci-lint configuration. The depguard rules encode the Clean Architecture
# import boundaries so violations fail CI rather than being caught in review.
#
# Schema v2. Migrated from the v1 format when `version: latest` in CI began
# resolving to golangci-lint v2, which rejects a v1 config outright — the lint
# step failed on the config before it read a line of Go. CI now pins an exact
# linter version so the same thing cannot happen again silently.
#
# govet, staticcheck, errcheck, ineffassign and unused are enabled by DEFAULT in
# v2 and so are absent from the enable list below; they are still running.
version: "2"

run:
  tests: true

linters:
  enable:
    - bodyclose
    - depguard
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive

  settings:
    depguard:
      rules:
        domain:
          # domain must not import delivery, infra, or heavy frameworks.
          files:
            - '**/internal/domain/**'
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: domain must not depend on the HTTP framework
            - pkg: github.com/jackc/pgx/v5
              desc: domain must not depend on the database driver
            - pkg: github.com/guardrail/guardrail/internal/infra
              desc: domain must not depend on infrastructure
            - pkg: github.com/guardrail/guardrail/internal/api
              desc: domain must not depend on the delivery layer
        app:
          # application layer may import domain, not delivery/infra concretions.
          files:
            - '**/internal/app/**'
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: use cases must not depend on the HTTP framework
            - pkg: github.com/guardrail/guardrail/internal/api
              desc: use cases must not depend on the delivery layer

    gosec:
      excludes:
        - G104 # handled by errcheck

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # Production code is held to these; test code is not, and the reasons are
      # specific rather than "tests do not matter":
      #
      #   gosec/bodyclose — a test that builds a weak key or leaks a response
      #     body on purpose is exercising the thing, not shipping it.
      #   noctx — these tests stand up real listeners and dial real sockets to
      #     prove the gateways work against a live peer. net.Dial is the point;
      #     rewriting them to DialContext would test less and read worse.
      #   revive — stub handlers exist to satisfy an interface, so unused
      #     parameters are the shape of the job, not an oversight.
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
          - revive

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
