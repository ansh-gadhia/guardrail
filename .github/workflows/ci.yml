name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-publish the current main without pushing a commit — for when a build
  # failed on something that had nothing to do with the code.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A cheap gate ahead of everything else: the version lives in VERSION, in the
  # installer's no-checkout default and in the changelog's released sections,
  # and those three drifted apart once already — VERSION reached 1.2.0 while
  # every change since 1.0.0 was still sitting under [Unreleased], so two
  # releases shipped with no record of what was in them. Nothing failed at the
  # time, which is exactly why it needs a check rather than a convention.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release.sh --check

  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: guardrail
          POSTGRES_DB: guardrail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guardrail"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Without this the action stops at the first local match: the runner
          # ships a preinstalled 1.26.x, "1.26" accepts it, and no newer patch is
          # ever fetched. That is how the security job ran on go1.26.5 and found
          # six standard-library advisories that 1.26.6 had already fixed — a
          # floating minor that silently pins to whatever the image happens to
          # carry. check-latest resolves against the published list instead.
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Download modules
        run: go mod download
      # Action v9 drives golangci-lint v2; v6 drove v1. `version: latest` is what
      # broke this step: latest rolled over to v2, which rejects a v1 config
      # outright, so lint failed on the config file rather than on any Go code.
      # Pinned to an exact version so the linter cannot change underneath a green
      # build — a lint gate that fails for reasons unrelated to the diff is a gate
      # people learn to ignore.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Build
        run: CGO_ENABLED=0 go build ./...

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  integration:
    name: Integration (live Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: guardrail
          POSTGRES_DB: guardrail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guardrail"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The job has been called "live Postgres + Redis" all along without one,
      # which is why the smoke test that checks both datastores are reachable
      # skipped on every run.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Without this the action stops at the first local match: the runner
          # ships a preinstalled 1.26.x, "1.26" accepts it, and no newer patch is
          # ever fetched. That is how the security job ran on go1.26.5 and found
          # six standard-library advisories that 1.26.6 had already fixed — a
          # floating minor that silently pins to whatever the image happens to
          # carry. check-latest resolves against the published list instead.
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Create app role + apply migrations + seed
        env:
          PGPASSWORD: guardrail
        run: |
          psql -h localhost -U guardrail -d guardrail -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='guardrail_app') THEN CREATE ROLE guardrail_app LOGIN PASSWORD 'apppass'; END IF; END \$\$;" \
            -c "GRANT CONNECT ON DATABASE guardrail TO guardrail_app;"
          for f in migrations/*.up.sql; do
            echo "applying $f"
            psql -h localhost -U guardrail -d guardrail -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U guardrail -d guardrail -v ON_ERROR_STOP=1 -f db/seed.sql
      - name: Run integration tests
        env:
          # The application connects as the least-privilege role, so that is what
          # the suite runs as.
          GUARDRAIL_TEST_DSN: postgres://guardrail_app:apppass@localhost:5432/guardrail?sslmode=disable
          # One test rewrites an audit row to prove the hash chain notices. The
          # app role is granted no UPDATE on audit_events — that is the whole
          # point — so simulating an attacker with database access needs the role
          # that owns the table.
          GUARDRAIL_TEST_OWNER_DSN: postgres://guardrail:guardrail@localhost:5432/guardrail?sslmode=disable
          # The envelope, AAD and binding-MAC tests SKIP without this rather than
          # fail, so leaving it unset is how the suite goes green having never
          # exercised credential sealing at all. A throwaway value: this database
          # is created and destroyed by the job.
          GUARDRAIL_TEST_MASTER_KEY: ci-integration-master-key-not-a-real-secret
          # The smoke test reads this one, and skips without it.
          GUARDRAIL_POSTGRES_DSN: postgres://guardrail_app:apppass@localhost:5432/guardrail?sslmode=disable
        run: |
          # pipefail, because `go test | tee` otherwise reports tee's exit status
          # and a failing suite would pass this step.
          set -o pipefail
          go test -tags=integration -count=1 -v ./test/... 2>&1 | tee /tmp/it.log

      # A skip here is not a test that does not apply to this platform — every
      # one of them is an unset variable or an empty table, and the tests that
      # skip that way are the ones covering credential sealing and its
      # tamper-evidence. Skipping all five and reporting ok is exactly what this
      # suite used to do.
      - name: Assert no integration test silently skipped
        run: |
          skipped=$(grep -c '^--- SKIP' /tmp/it.log || true)
          if [ "${skipped}" -ne 0 ]; then
            echo "::error::${skipped} integration test(s) skipped rather than ran."
            grep '^--- SKIP' /tmp/it.log
            exit 1
          fi
          echo "all $(grep -c '^--- PASS' /tmp/it.log) integration tests ran; none skipped"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the range <before>^..<after> for a push, so it needs
          # the parent of the FIRST pushed commit. The default shallow clone does
          # not have it, and a push of several commits at once then dies with
          # "ambiguous argument ...^..." having scanned nothing — a secret scan
          # that cannot start is worse than none, because the job goes red for a
          # reason unrelated to the code and people learn to ignore it.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Without this the action stops at the first local match: the runner
          # ships a preinstalled 1.26.x, "1.26" accepts it, and no newer patch is
          # ever fetched. That is how the security job ran on go1.26.5 and found
          # six standard-library advisories that 1.26.6 had already fixed — a
          # floating minor that silently pins to whatever the image happens to
          # carry. check-latest resolves against the published list instead.
          check-latest: true
          cache-dependency-path: backend/go.sum
      # Both scanners are pinned. @latest means every run installs whatever was
      # published minutes ago, so a scanner release can turn main red overnight
      # for a reason that has nothing to do with the commit that triggered it —
      # and the build is no longer reproducible: the same tree scans differently
      # on Tuesday than it did on Monday. Bump these deliberately; a scanner
      # upgrade is a change worth reviewing, like any other dependency.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          cd backend && govulncheck ./...
      - name: gosec (static security analysis)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          cd backend && gosec -exclude-generated -severity medium ./...
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      # Tag is v-prefixed. Pinned as `0.24.0` this resolved to nothing, and
      # GitHub resolves every action in a job BEFORE running any step — so the
      # whole security job died in "Prepare all required actions" after two
      # seconds, having scanned nothing. A security gate that cannot start is
      # worse than no gate: the check is red for a reason unrelated to the code,
      # so it gets ignored.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          # backend/vendor is the Go dependency tree, checked in so the image can
          # build offline. It contains other projects' Dockerfiles and test data,
          # none of which we build or ship — go-toml's own Dockerfile was failing
          # the scan for not declaring a USER. Vulnerabilities in those
          # dependencies are still caught: that scan reads backend/go.mod, which
          # is not in this directory.
          skip-dirs: backend/vendor

  # Builds both runtime images and, on main only, publishes them to GHCR.
  #
  # Publishing lives in the same workflow as the tests and behind `needs:` on
  # purpose. A separate release workflow cannot depend on this one's jobs, so it
  # would happily publish an image built from a commit whose tests had just gone
  # red — and the first anyone would know is a server pulling it.
  #
  # A pull request still builds both images (that catches a broken Dockerfile
  # before merge) but never logs in and never pushes.
  publish:
    name: Images (build; publish from main)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./backend
          - component: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and version
        id: meta
        run: |
          # GHCR rejects uppercase in a path; a GitHub owner may contain it.
          # Derived rather than hardcoded so a fork publishes to its own
          # namespace instead of failing on a package it cannot write.
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/guardrail-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          # The VERSION file is the single source of truth for the tag, so
          # bumping it is what cuts a release — no git tag involved.
          echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag must name one build, for ever.
      #
      # It did not. Publishing overwrote :<VERSION> on every push to main, so
      # the tag a deployment pins to moved underneath it and "we were running
      # 1.4.0" was unfalsifiable — the running image could be any of the builds
      # published while VERSION happened to read 1.4.0. That is a poor property
      # for any product and an unacceptable one for a privileged-access broker,
      # where the first question after an incident is what code held the
      # credentials.
      #
      # From here, publishing a version that already exists FAILS. Cutting a
      # release means bumping VERSION — which scripts/release.sh already does,
      # and which the version job already checks for consistency.
      #
      # :latest and :sha-<commit> are unaffected: one is explicitly a moving
      # pointer, the other is immutable by construction.
      - name: Refuse to overwrite a published version
        if: github.event_name != 'pull_request'
        run: |
          image='${{ steps.meta.outputs.image }}'
          version='${{ steps.meta.outputs.version }}'
          if docker manifest inspect "${image}:${version}" >/dev/null 2>&1; then
            echo "::error::${image}:${version} is already published."
            echo "A version tag names one build and must not be overwritten."
            echo "Bump VERSION (scripts/release.sh patch|minor|major) and push again."
            exit 1
          fi
          echo "${image}:${version} is unpublished — proceeding."

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # amd64 only. arm64 would need QEMU emulation, and the API image
          # installs Chromium — emulated, that turns a three-minute build into a
          # forty-minute one on every push to main. Add
          # `platforms: linux/amd64,linux/arm64` here if you ever deploy to
          # Graviton or a Pi and can live with the wait.
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          # Registry cache, so a rebuild after an unrelated change does not
          # redo the Go module graph and the Chromium install from scratch.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.meta.outputs.image) || '' }}
          # Provenance and SBOM attestations. These were off, which left the
          # published image with nothing to check it against: a version tag that
          # moves (see the guard above) AND no attestation means "we were running
          # 1.4.0" cannot be corroborated by anything.
          provenance: true
          sbom: true
          # The digest of what was actually pushed, so the summary can print
          # something an operator can pin to.
          outputs: type=image,push=${{ github.event_name != 'pull_request' }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published \`${{ matrix.component }}\`"
            echo ""
            echo "| Tag | Meaning |"
            echo "|---|---|"
            echo "| \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\` | this release — immutable, republishing it fails |"
            echo "| \`${{ steps.meta.outputs.image }}:latest\` | newest main build |"
            echo "| \`${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}\` | immutable, this commit |"
          } >> "$GITHUB_STEP_SUMMARY"
