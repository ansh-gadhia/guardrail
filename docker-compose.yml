# GuardRail — the whole platform, one file.
#
# Deploying to a server on your LAN:
#
#   1. cp .env.example .env   and fill in every secret it asks for
#   2. docker compose up -d --build
#   3. browse to https://<server-lan-ip>/  from any PC on the network
#
# Everything is reachable over the LAN on 443 (80 redirects to it). The bundled
# certificate is self-signed, so the first visit warns until you install a real
# one — see deploy/traefik/dynamic/tls.yml for how to replace or regenerate it.
#
# All services set `restart: unless-stopped`, so the stack comes back by itself
# after a reboot as long as the Docker daemon starts at boot
# (`systemctl enable docker`). State lives in the named volumes at the bottom
# and survives `docker compose down`; only `down -v` destroys it.
#
# Every published port comes from .env — nothing here is hardcoded. The defaults
# below apply when the variable is unset:
#
#   GUARDRAIL_HTTPS_PORT  443        console + API + brokered sessions (the LAN port)
#   GUARDRAIL_HTTP_PORT   80         redirects to HTTPS
#   POSTGRES_PORT         5432       bound to POSTGRES_BIND_ADDR (127.0.0.1)
#   REDIS_PORT            6379       bound to REDIS_BIND_ADDR    (127.0.0.1)
#
# Postgres and Redis reach only the server itself, for psql and backups. The API
# (8080) and its metrics (9090) are not published at all: they stay on the
# internal Docker network behind Traefik.

name: guardrail

services:
  postgres:
    image: postgres:16-alpine
    networks: [data]
    # TLS on. Everything between the API and the database used to cross the
    # network in the clear: sealed ciphertext AND the wrapped DEKs beside it,
    # password hashes, the audit chain, and the application role's own password
    # during connection setup.
    #
    # The certificate is generated by install.sh (generate_pg_cert) with CN and
    # SAN "postgres", which is the host the DSN names — so the client can verify
    # what it dialled rather than merely encrypting to whatever answered.
    #
    # Enabling ssl does NOT force it: a client asking for sslmode=disable is
    # still served plaintext. What forces it is the DSN below saying
    # sslmode=verify-full. Both halves are here, but they are separable, which is
    # what makes the upgrade safe to do in one step and safe to back out of.
    #
    # The client half is ONE variable, GUARDRAIL_PG_SSLPARAMS, carrying the whole
    # query string rather than a mode and a path separately. That is not tidiness:
    # pgx reads sslrootcert and fails to open the file EVEN WHEN sslmode=disable,
    #
    #   fatal: parse postgres dsn: ... failed to configure TLS (unable to read CA
    #   file: open /etc/guardrail/pgtls/server.crt: no such file or directory)
    #
    # so a hard-coded sslrootcert next to a defaulted-off sslmode moves the
    # upgrade failure off Postgres and onto the API, which then crash-loops
    # instead. One variable cannot get into that half-state.
    #
    # ssl is a FLAG, defaulting off, and that is what makes this file safe to
    # land on a deployment whose install.sh has not caught up yet.
    #
    # An update replaces docker-compose.yml and install.sh together, but the
    # install.sh already RUNNING continues with its old code — so the new compose
    # file gets driven by the old script, which knows nothing about generating a
    # database certificate. Hard-coding ssl=on here meant Postgres started with
    # no certificate to load and died in a restart loop:
    #
    #   FATAL: could not load server certificate file ".../server.crt"
    #
    # With the flag, that deployment comes up exactly as it did before, and TLS
    # switches on at the next update once the certificate exists.
    command:
      - postgres
      - -c
      - ssl=${GUARDRAIL_PG_SSL:-off}
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      # Which client-authentication file to use. ssl=on only OFFERS TLS — a
      # client asking for sslmode=disable is still served plaintext — so the file
      # below is what REQUIRES it, by ending in hostssl instead of host.
      #
      # Defaults to the image's own generated file, which is the same path
      # PostgreSQL would use with no flag at all, so this is a no-op until
      # install.sh points it elsewhere. It does that only in the branch that also
      # turns ssl on: demanding TLS from a server with no certificate would lock
      # every client out of the database, which is worse than the plaintext it
      # was meant to prevent.
      - -c
      - hba_file=${GUARDRAIL_PG_HBA:-/var/lib/postgresql/data/pg_hba.conf}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-guardrail}
      GUARDRAIL_DB_APP_PASSWORD: ${GUARDRAIL_DB_APP_PASSWORD:?set GUARDRAIL_DB_APP_PASSWORD in .env}
    # Loopback-bound on purpose: local psql, migrations and backups work, but the
    # database is not exposed to the network. Widening POSTGRES_BIND_ADDR puts the
    # database on the network — see the warning in .env.example.
    ports:
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Source is a NAME or a PATH, chosen by one variable.
      #
      # Compose reads a mount source that starts with "/" as a bind mount and
      # anything else as a named volume, so leaving GUARDRAIL_PGDATA_MOUNT unset
      # keeps the Docker-managed volume this has always used, while setting it to
      # an absolute path puts the data on a disk of your choosing. Nothing else in
      # the file changes either way. scripts/migrate-data.sh sets these, moves the
      # bytes and restarts the stack; install.sh asks for the path up front.
      - ${GUARDRAIL_PGDATA_MOUNT:-pgdata}:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      # Read-only, and the KEY's host ownership (root:70, 0640) is what lets the
      # server read it: PostgreSQL refuses to start if the key is any more
      # readable than that. See pg_cert_modes in install.sh.
      - ./deploy/postgres/tls:/etc/postgresql/tls:ro
      # Read-only and always mounted, so selecting it is a flag change rather
      # than a compose change. See the hba_file note above.
      - ./deploy/postgres/hba:/etc/postgresql/hba:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardrail} -d ${POSTGRES_DB:-guardrail}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [data]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "${REDIS_BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      # Name or absolute path — see the note on pgdata above.
      - ${GUARDRAIL_REDIS_MOUNT:-redisdata}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # guacd — the Apache Guacamole proxy daemon, which speaks RDP and VNC to devices
  # and renders them into drawing instructions the console draws on a canvas.
  #
  # Enabled by profile: a deployment with no desktops to broker should not run a
  # daemon it never uses. Start it with `docker compose --profile desktop up -d`,
  # and set GUARDRAIL_DESKTOP_ENABLED=true so the API wires the gateways.
  #
  # Its port is published to LOOPBACK ONLY, and that default must not be widened.
  # guacd has no authentication of its own — anything that can reach 4822 can ask
  # it to connect to any host with any credential — so exposing it to the network
  # would hand out an unauthenticated connection broker. It is published at all
  # only because the API also runs as a native host process in this deployment
  # (scripts/run-host-api.sh), where a container-network-only port is unreachable;
  # this mirrors what postgres and redis already do, and 127.0.0.1 keeps it off
  # the LAN. When the API runs as the compose `api` service it reaches guacd at
  # guacd:4822 over the internal network and none of this applies.
  guacd:
    image: guacamole/guacd:1.5.5
    networks: [session]
    profiles: ["desktop"]
    # Runs as the image's own user (uid 1000), deliberately. An earlier attempt at
    # the recording handover ran it as the API's uid instead, so that the file
    # guacd writes would be owned by the reader. That broke RDP outright: uid 65532
    # has no passwd entry in this image, so HOME is unset, and FreeRDP builds its
    # certificate store under $HOME/.config/freerdp — with nowhere to put it the
    # connection died at "Security negotiation failed (wrong security type?)",
    # which reads like a protocol problem and is not one.
    #
    # No uid override is needed anyway: guacd creates recordings 0640 (see
    # libguac/recording.c), so group-readable is enough. bootstrap.sh owns the
    # directory 1000:65532 with setgid, which lets guacd write as itself and the
    # API read as the group. Neither has to pretend to be the other.
    ports:
      - "${GUACD_BIND_ADDR:-127.0.0.1}:${GUACD_PORT:-4822}:4822"
    volumes:
      # Bind-mounted at an IDENTICAL path on both sides, not a named volume.
      # GUARDRAIL_GUACD_RECORDING_DIR is a single string that guacd writes to and
      # the API reads back, so it must mean the same thing in both namespaces. A
      # named volume satisfies that only while the API is also a container; when it
      # runs natively (scripts/run-host-api.sh) the path exists solely inside
      # guacd, guacd records happily, and the API finds nothing to collect — a
      # recorded session with no evidence, discovered when someone goes looking.
      - ${GUARDRAIL_GUACD_RECORDING_DIR:-/var/lib/guardrail/desktop-recordings}:${GUARDRAIL_GUACD_RECORDING_DIR:-/var/lib/guardrail/desktop-recordings}
      # guacd's own certificate. The KEY's host ownership (root:1000, 0640) is
      # what lets guacd read it — it runs as uid 1000 in this image.
      - ./deploy/guacd/tls:/etc/guacd/tls:ro
    # TLS on the guacd hop. Target RDP and VNC passwords travel this connection
    # as guacd connection parameters, and guacd has no authentication of its own
    # — so before this, anything on the network could both read them and drive
    # guacd to reach the estate outside GuardRail's audit trail.
    #
    # -C/-K are guacd's own TLS options; it is linked against OpenSSL in this
    # image. The API verifies this certificate, so the hop is authenticated as
    # well as encrypted.
    # Same reasoning as the database's ssl flag: empty until install.sh has
    # generated a certificate, so an update driven by an older script brings
    # guacd up plaintext rather than failing to start.
    environment:
      GUACD_TLS_ARGS: ${GUARDRAIL_GUACD_TLS_ARGS:-}
    entrypoint: ["/bin/sh", "-c", "/opt/guacamole/sbin/guacd -b 0.0.0.0 -L $$GUACD_LOG_LEVEL -f $$GUACD_TLS_ARGS"]
    restart: unless-stopped

  # One-shot migration runner (golang-migrate). Runs as the superuser to apply
  # DDL, then exits. The API waits for it to complete successfully.
  migrate:
    image: migrate/migrate:v4.17.1
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
      # The server certificate, used as the trust anchor. It is self-signed, so
      # it IS its own CA — pinning it is what makes verify-full meaningful here
      # rather than needing a public authority.
      - ./deploy/postgres/tls:/etc/guardrail/pgtls:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-guardrail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardrail}?${GUARDRAIL_PG_SSLPARAMS:-sslmode=disable}
      - up
    restart: on-failure

  # One-shot seed loader: after migrations, load the permission catalogue, system
  # roles, and the default organization (idempotent — ON CONFLICT). The API needs
  # this data to function (e.g. seed-admin resolves the default org).
  seed:
    image: postgres:16-alpine
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend/db/seed.sql:/seed.sql:ro
      - ./deploy/postgres/tls:/etc/guardrail/pgtls:ro
    entrypoint:
      - sh
      - -c
      - psql "postgresql://${POSTGRES_USER:-guardrail}@postgres:5432/${POSTGRES_DB:-guardrail}?${GUARDRAIL_PG_SSLPARAMS:-sslmode=disable}" -v ON_ERROR_STOP=1 -f /seed.sql
    restart: on-failure

  api:
    # Published image by default; `docker compose build` still rebuilds it from
    # source locally. Both keys together mean a server can `compose pull` without
    # a checkout, while a developer's `compose up --build` keeps working.
    #
    # THE VERSION IS THE INTERFACE; THE DIGEST IS THE GUARANTEE.
    #
    # An operator updates by version — that is what install.sh asks for and what
    # the release notes talk about. GUARDRAIL_API_DIGEST is appended to it as
    # "@sha256:…", which Docker accepts alongside a tag: the reference stays
    # readable AND names exactly one build.
    #
    # install.sh records that digest at update time (pin_image_digests), so a
    # deployment can always answer "what is actually running" with something
    # that cannot have moved underneath it. Unset, this collapses to the plain
    # tag — which is what a build-from-source deployment gets, and what every
    # deployment did before 1.4.
    image: ${GUARDRAIL_IMAGE_API:-ghcr.io/ansh-gadhia/guardrail-api}:${VERSION:-latest}${GUARDRAIL_API_DIGEST:-}
    networks: [edge, data, session]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      GUARDRAIL_ENV: ${GUARDRAIL_ENV:-production}
      # Fixed, and deliberately not configurable: this port exists only inside the
      # container's own network namespace, where nothing can collide with it, and
      # deploy/traefik/dynamic/routes.yml hardcodes the matching upstream. It is
      # never published. Change both together or not at all.
      GUARDRAIL_HTTP_ADDR: ":8080"
      GUARDRAIL_METRICS_ADDR: ":9090"
      # API connects as the least-privilege app role so RLS is enforced.
      # verify-full, not require: require encrypts but accepts any certificate,
      # so it stops a passive listener and not an active one. verify-full also
      # checks the name, and the certificate's SAN is "postgres" — the host this
      # DSN dials.
      GUARDRAIL_POSTGRES_DSN: postgres://guardrail_app:${GUARDRAIL_DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardrail}?${GUARDRAIL_PG_SSLPARAMS:-sslmode=disable}
      GUARDRAIL_REDIS_ADDR: redis:6379
      GUARDRAIL_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      GUARDRAIL_JWT_SIGNING_KEY: ${GUARDRAIL_JWT_SIGNING_KEY:?set in .env}
      GUARDRAIL_MASTER_KEY: ${GUARDRAIL_MASTER_KEY:?set in .env}
      # Primary super admin, seeded idempotently on first boot (see .env).
      GUARDRAIL_ADMIN_EMAIL: ${GUARDRAIL_ADMIN_EMAIL:-}
      GUARDRAIL_ADMIN_PASSWORD: ${GUARDRAIL_ADMIN_PASSWORD:-}
      GUARDRAIL_ADMIN_USERNAME: ${GUARDRAIL_ADMIN_USERNAME:-admin}
      GUARDRAIL_ADMIN_ORG: ${GUARDRAIL_ADMIN_ORG:-default}
      # Traefik terminates TLS and is the only thing that can reach this port, so
      # the client IP in the audit log is whatever it forwards. Defaults match
      # that topology; .env can narrow them if you put the API somewhere else.
      GUARDRAIL_TRUST_PROXY_HEADERS: ${GUARDRAIL_TRUST_PROXY_HEADERS:-true}
      GUARDRAIL_TRUSTED_PROXIES: ${GUARDRAIL_TRUSTED_PROXIES:-0.0.0.0/0}
      # The console is served from the same origin as the API, so this only
      # matters if you point a separately-hosted UI at this server.
      GUARDRAIL_CORS_ALLOW_ORIGINS: ${GUARDRAIL_CORS_ALLOW_ORIGINS:-}
      # Whole-host session delivery: proxied devices are served at
      # <session-id>.<this-domain>, at the root of their own origin. Needs
      # wildcard DNS for *.<domain> (see the `dns` profile below) and a cert
      # naming it (bootstrap.sh generates one). Empty disables it and puts every
      # session back on /proxy/<sid>/.
      GUARDRAIL_TUNNEL_DOMAIN: ${GUARDRAIL_TUNNEL_DOMAIN-tunnel.guardrail.lan}
      # The port operators actually reach this deployment on, which is Traefik's
      # published port and NOT GUARDRAIL_HTTP_ADDR above (that one is internal to
      # the container network). The API needs it for exactly one thing: a tunnel
      # session moves the operator to a different hostname, so the server has to
      # write that URL out in full — and a URL written without the port sends the
      # browser to 443. On a deployment published anywhere else that is a refused
      # connection on every tunnel session, while the console itself works fine.
      GUARDRAIL_HTTPS_PORT: ${GUARDRAIL_HTTPS_PORT:-443}
      # Session recording needs the isolation gateway: the reverse proxy never
      # sees pixels. Chromium and the recordings directory ship in the image.
      GUARDRAIL_BROWSER_ISOLATION: ${GUARDRAIL_BROWSER_ISOLATION:-true}
      # Isolated-session screencast geometry/quality. Left empty they fall back to
      # the gateway default (1280x800 / quality 60, full sharpness). Capture holds
      # ~60fps at that size, so lower these only on a host that is genuinely encode-
      # or bandwidth-bound. MAX_FPS optionally caps the live viewer (0 = uncapped);
      # it does not affect input responsiveness, which the gateway handles itself.
      GUARDRAIL_ISOLATION_WIDTH: ${GUARDRAIL_ISOLATION_WIDTH:-}
      GUARDRAIL_ISOLATION_HEIGHT: ${GUARDRAIL_ISOLATION_HEIGHT:-}
      GUARDRAIL_ISOLATION_QUALITY: ${GUARDRAIL_ISOLATION_QUALITY:-}
      GUARDRAIL_ISOLATION_MAX_FPS: ${GUARDRAIL_ISOLATION_MAX_FPS:-}
      # RDP/VNC via the guacd sidecar. Both must agree: this switch wires the
      # gateways, the compose profile starts the daemon.
      GUARDRAIL_DESKTOP_ENABLED: ${GUARDRAIL_DESKTOP_ENABLED:-false}
      GUARDRAIL_GUACD_ADDR: ${GUARDRAIL_GUACD_ADDR:-guacd:4822}
      GUARDRAIL_GUACD_RECORDING_DIR: ${GUARDRAIL_GUACD_RECORDING_DIR:-/var/lib/guardrail/desktop-recordings}
      # Pins guacd's certificate. Empty leaves the hop plaintext, which a
      # deployment pointing at somebody else's guacd may still need.
      # Empty until install.sh has issued the certificate, for the same reason
      # as the database flags. Pointing at a path that does not exist yet is not
      # fatal — the gateway warns and falls back to plaintext — but the warning
      # reads "guacd TLS is configured but could not be enabled", which on a
      # deployment where nothing was configured is simply untrue. Setting it from
      # install.sh, beside the flag that turns guacd's own TLS on, keeps the two
      # halves in step and keeps that warning honest whenever it does appear.
      GUARDRAIL_GUACD_TLS_CA: ${GUARDRAIL_GUACD_TLS_CA:-}
      GUARDRAIL_RECORDING_DIR: ${GUARDRAIL_RECORDING_DIR:-/var/lib/guardrail/recordings}
      # Seeds the retention policy of an organization that has never set one.
      # The live value lives in the database and is edited in the console; this
      # is the default a fresh tenant inherits, shown there beside it.
      GUARDRAIL_RECORDING_RETENTION_DAYS: ${GUARDRAIL_RECORDING_RETENTION_DAYS:-90}
      GUARDRAIL_LOG_LEVEL: ${GUARDRAIL_LOG_LEVEL:-info}
      GUARDRAIL_LOG_FORMAT: ${GUARDRAIL_LOG_FORMAT:-json}

      # Optional features, commented out in .env. They are forwarded anyway so
      # that uncommenting one there is enough to switch it on — otherwise the
      # variable would sit in .env looking configured while the container never
      # saw it. The three defaults restated here have a non-empty default in Go
      # (config.go), and passing an empty value would override it rather than
      # fall back; keep them in step if that default ever changes.
      GUARDRAIL_ACCESS_TOKEN_TTL: ${GUARDRAIL_ACCESS_TOKEN_TTL:-15m}
      GUARDRAIL_REFRESH_TOKEN_TTL: ${GUARDRAIL_REFRESH_TOKEN_TTL:-720h}
      # Ceiling on a session with no approved window, and the window an approved
      # request falls back to when nobody named one. Neither is what ends a
      # session in normal use — that is the per-device idle timeout.
      GUARDRAIL_MAX_SESSION_WINDOW: ${GUARDRAIL_MAX_SESSION_WINDOW:-12h}
      GUARDRAIL_APPROVAL_WINDOW: ${GUARDRAIL_APPROVAL_WINDOW:-1h}
      # How many break-glass connects one person may TAKE per window. 0 turns the
      # limit off, which makes the approval gate advisory.
      GUARDRAIL_EMERGENCY_QUOTA: ${GUARDRAIL_EMERGENCY_QUOTA:-2}
      GUARDRAIL_EMERGENCY_QUOTA_WINDOW: ${GUARDRAIL_EMERGENCY_QUOTA_WINDOW:-168h}
      GUARDRAIL_SERVICE_NAME: ${GUARDRAIL_SERVICE_NAME:-guardrail-api}
      # These default to empty in Go, so forwarding empty is the same as unset.
      GUARDRAIL_FEDERATION_ORG_ID: ${GUARDRAIL_FEDERATION_ORG_ID:-}
      GUARDRAIL_OIDC_ISSUER: ${GUARDRAIL_OIDC_ISSUER:-}
      GUARDRAIL_OIDC_CLIENT_ID: ${GUARDRAIL_OIDC_CLIENT_ID:-}
      GUARDRAIL_OIDC_CLIENT_SECRET: ${GUARDRAIL_OIDC_CLIENT_SECRET:-}
      GUARDRAIL_OIDC_REDIRECT_URL: ${GUARDRAIL_OIDC_REDIRECT_URL:-}
      GUARDRAIL_LDAP_URL: ${GUARDRAIL_LDAP_URL:-}
      GUARDRAIL_LDAP_BIND_DN: ${GUARDRAIL_LDAP_BIND_DN:-}
      GUARDRAIL_LDAP_BIND_PASSWORD: ${GUARDRAIL_LDAP_BIND_PASSWORD:-}
      GUARDRAIL_LDAP_BASE_DN: ${GUARDRAIL_LDAP_BASE_DN:-}
      GUARDRAIL_LDAP_USER_FILTER: ${GUARDRAIL_LDAP_USER_FILTER:-}
      # ---- SIEM single sign-on ----
      #
      # A setting only reaches the running service if it is listed HERE. A field
      # that exists in Go config but is missing from this block is permanently
      # stuck at its default, silently, with nothing anywhere saying so — which is
      # why every one of these is written out even though most are empty.
      #
      # Related: after changing one of these, `up -d` the api service rather than
      # `restart` it. A restart reuses the old environment.
      #
      # Setting GUARDRAIL_SIEM_JWKS_URL together with GUARDRAIL_FEDERATION_ORG_ID
      # is what switches the feature on. Everything else has a working default.
      #
      # Each of the three also answers to the unprefixed name the SIEM's own
      # documentation uses, so three lines copied from another consumer's .env
      # work here unchanged. The GUARDRAIL_ spelling wins when both are set.
      GUARDRAIL_SIEM_JWKS_URL: ${GUARDRAIL_SIEM_JWKS_URL:-${SIEM_JWKS_URL:-}}
      GUARDRAIL_SIEM_JWKS_CA_BUNDLE: ${GUARDRAIL_SIEM_JWKS_CA_BUNDLE:-${SIEM_JWKS_CA_BUNDLE:-}}
      # Leave empty. It enables HS256, which hands this container a key that can
      # FORGE the SIEM's assertions rather than only check them.
      GUARDRAIL_SIEM_SSO_SECRET: ${GUARDRAIL_SIEM_SSO_SECRET:-${SIEM_SSO_SECRET:-}}
      GUARDRAIL_SIEM_SSO_ISSUER: ${GUARDRAIL_SIEM_SSO_ISSUER:-cybersentinel-siem}
      GUARDRAIL_SIEM_SSO_AUDIENCE: ${GUARDRAIL_SIEM_SSO_AUDIENCE:-guardrail-pam}
      GUARDRAIL_SIEM_JWKS_CACHE_TTL: ${GUARDRAIL_SIEM_JWKS_CACHE_TTL:-10m}
      GUARDRAIL_SIEM_SSO_CLOCK_LEEWAY: ${GUARDRAIL_SIEM_SSO_CLOCK_LEEWAY:-1m}
      GUARDRAIL_SIEM_SSO_MAX_TOKEN_AGE: ${GUARDRAIL_SIEM_SSO_MAX_TOKEN_AGE:-10m}
      GUARDRAIL_SIEM_SSO_NONCE_FLOOR: ${GUARDRAIL_SIEM_SSO_NONCE_FLOOR:-5m}
      GUARDRAIL_SIEM_SSO_NONCE_CEILING: ${GUARDRAIL_SIEM_SSO_NONCE_CEILING:-1h}
      GUARDRAIL_SIEM_SSO_JIT_PROVISION: ${GUARDRAIL_SIEM_SSO_JIT_PROVISION:-true}
      GUARDRAIL_SIEM_SSO_SYNC_ON_LOGIN: ${GUARDRAIL_SIEM_SSO_SYNC_ON_LOGIN:-true}
      # Both off by default, and both defaults run the opposite way to the obvious
      # choice: a second factor somebody deliberately enrolled here, and an
      # administrator's address allowlist, are each doing real work on a broker
      # that stands in front of privileged devices. Neither should switch itself
      # off as a side effect of turning single sign-on on.
      GUARDRAIL_SIEM_SSO_TRUST_AMR: ${GUARDRAIL_SIEM_SSO_TRUST_AMR:-false}
      GUARDRAIL_SIEM_SSO_ALLOWLIST_BYPASS: ${GUARDRAIL_SIEM_SSO_ALLOWLIST_BYPASS:-false}
      GUARDRAIL_SIEM_SSO_DEFAULT_ROLE: ${GUARDRAIL_SIEM_SSO_DEFAULT_ROLE:-Read-only}
      GUARDRAIL_SIEM_SSO_MAX_ROLE: ${GUARDRAIL_SIEM_SSO_MAX_ROLE:-}
      GUARDRAIL_SIEM_SSO_ROLE_MAP: ${GUARDRAIL_SIEM_SSO_ROLE_MAP:-}
      GUARDRAIL_OTLP_ENDPOINT: ${GUARDRAIL_OTLP_ENDPOINT:-}
    volumes:
      # The database's certificate, used as the trust anchor for the DSN above.
      # Self-signed, so it is its own CA: pinning it is what lets verify-full
      # mean something without a public authority anywhere.
      - ./deploy/postgres/tls:/etc/guardrail/pgtls:ro
      # guacd's certificate, pinned for the hop that carries RDP/VNC passwords.
      - ./deploy/guacd/tls:/etc/guardrail/guacdtls:ro
      # Name or absolute path — see the note on pgdata above. The container path
      # stays put: GUARDRAIL_RECORDING_DIR is what the API writes to inside its
      # own namespace, and relocating the data must not change it.
      - ${GUARDRAIL_RECORDINGS_MOUNT:-recordings}:/var/lib/guardrail/recordings
      # The same volume guacd writes desktop recordings into; the API moves them
      # into the blob store when a session ends.
      # Bind-mounted at an IDENTICAL path on both sides, not a named volume.
      # GUARDRAIL_GUACD_RECORDING_DIR is a single string that guacd writes to and
      # the API reads back, so it must mean the same thing in both namespaces. A
      # named volume satisfies that only while the API is also a container; when it
      # runs natively (scripts/run-host-api.sh) the path exists solely inside
      # guacd, guacd records happily, and the API finds nothing to collect — a
      # recorded session with no evidence, discovered when someone goes looking.
      - ${GUARDRAIL_GUACD_RECORDING_DIR:-/var/lib/guardrail/desktop-recordings}:${GUARDRAIL_GUACD_RECORDING_DIR:-/var/lib/guardrail/desktop-recordings}
      # The SIEM's TLS certificate, for pinning the JWKS fetch
      # (GUARDRAIL_SIEM_JWKS_CA_BUNDLE=/etc/guardrail/siem/jwks-ca.pem).
      #
      # Its own directory rather than deploy/tls, which holds the console's
      # certificate and key: these are opposite jobs — one proves GuardRail's
      # identity to browsers, the other decides whose word GuardRail takes about
      # who may sign in — and they rotate on unrelated schedules. Read-only, and
      # always mounted: an empty directory costs nothing, and a bind mount that
      # only exists when a variable is set is the kind of conditional that gets
      # discovered at the worst moment.
      - ./deploy/siem:/etc/guardrail/siem:ro
    # Join guacd's group (its image's gid 1000). guacd writes each desktop
    # recording group-readable (0640) into the shared dir above; this makes the
    # API a member of that group, so it can read the recording back and move it to
    # the blob store no matter what its own primary gid is. This is the whole
    # mechanism that lets a recording survive the hop from guacd to the API — file
    # permission at the OS level, with the recording:read RBAC still enforced at
    # the API. Pair it with a recording dir owned 1000:1000 and setgid (bootstrap
    # sets that) so new recordings keep landing in group 1000.
    group_add:
      - "1000"
    # Chromium's renderers need more than Docker's default 64MB of /dev/shm, even
    # with --disable-dev-shm-usage, once a device UI paints anything substantial.
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "/guardrail", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Web console (React SPA served by nginx). Traefik routes everything that is
  # not /api or /proxy here.
  web:
    image: ${GUARDRAIL_IMAGE_WEB:-ghcr.io/ansh-gadhia/guardrail-web}:${VERSION:-latest}${GUARDRAIL_WEB_DIGEST:-}
    networks: [edge]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  traefik:
    image: traefik:v3.1
    networks: [edge]
    command:
      # Routes and TLS come from deploy/traefik/dynamic/*.yml. There is no Docker
      # provider and no docker.sock mount here on purpose — see routes.yml.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Traefik listens on the SAME port inside the container as the one published
      # on the host. That symmetry is load-bearing: the HTTP->HTTPS redirect is
      # built from the target entrypoint's own address, and Traefik has no idea
      # what the host mapped it to. Publishing 8443:443 would bounce operators to
      # https://server:443 — a port nothing is listening on.
      - --entrypoints.web.address=:${GUARDRAIL_HTTP_PORT:-80}
      - --entrypoints.websecure.address=:${GUARDRAIL_HTTPS_PORT:-443}
      # A PAM console has no business answering in plaintext: the HTTP port exists
      # only to bounce operators who typed the address without a scheme.
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
    ports:
      - "${GUARDRAIL_HTTP_PORT:-80}:${GUARDRAIL_HTTP_PORT:-80}"
      - "${GUARDRAIL_HTTPS_PORT:-443}:${GUARDRAIL_HTTPS_PORT:-443}"
    volumes:
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./deploy/tls:/etc/traefik/certs:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  # Wildcard DNS for the session tunnel, for networks where you cannot add a
  # record to the LAN resolver. It answers *.<tunnel-domain> with THIS host's
  # current IP, detected at startup from the kernel routing table — so nothing
  # here hardcodes an address and a DHCP lease change is picked up on restart.
  #
  # Opt-in, so `make install` never fails on a port bind:
  #
  #   docker compose --profile dns up -d
  #
  # Then point client machines' primary DNS at this server (keep their normal
  # resolver as secondary). If you can add one record to the LAN router instead,
  # prefer that and leave this off — see SETUP.md.
  #
  # It binds the host's LAN address SPECIFICALLY rather than 0.0.0.0. On a
  # systemd-resolved host (most Ubuntu/Debian) the stub listener already holds
  # 127.0.0.53:53, and a wildcard bind overlaps it and fails with EADDRINUSE.
  # Taking just the LAN address sidesteps that entirely, so the host's own
  # resolver keeps working untouched and nothing has to be disabled.
  #
  # WHICH address that is comes from GUARDRAIL_HOST_IP, and on a multi-homed host
  # it has to: the fallback below follows the lowest-metric DEFAULT ROUTE, which
  # on a server with a management NIC and a service NIC is regularly the wrong
  # one. The failure is quiet and looks like nothing at all — the container is up
  # and healthy, dnsmasq is serving the zone perfectly, and clients pointed at the
  # address the operator has in mind get connection-refused because nothing is
  # listening there. Worse, the wildcard would answer with that same wrong
  # address, so a client that did reach the resolver is handed a route it does not
  # have. Detection is a convenience for the single-homed case, not the answer.
  #
  # Queries for the tunnel domain are answered locally; everything else is
  # forwarded upstream, so a client can safely use this as its primary resolver.
  dns:
    profiles: [dns]
    image: 4km3/dnsmasq:2.90-r3
    network_mode: host
    cap_add: [NET_ADMIN]
    entrypoint: ["/bin/sh", "-c"]
    # dnsmasq binds ONE address, so it cannot start until that address is on the
    # host. Two ways that goes wrong, and both used to end the same way — exit 2,
    # `restart: unless-stopped`, and a container flapping forever with the reason
    # buried in `docker logs`:
    #
    #   - The host has not finished coming up. Docker starts before DHCP has a
    #     lease often enough that this is the normal case after a reboot, not an
    #     edge one. So the address is waited for rather than demanded once.
    #   - GUARDRAIL_HOST_IP names an address this host does not have — a value
    #     carried over from another machine, or a NIC that was renumbered. That
    #     one is never going to fix itself, so it says so in as many words and
    #     names the addresses the host does have.
    #
    # The configured address is never quietly swapped for a detected one. Binding
    # "some address that works" is what put the resolver on the wrong NIC in the
    # first place: it answered, on an interface no client could reach, and looked
    # healthy the whole time.
    command:
      - >
        DOMAIN="${GUARDRAIL_TUNNEL_DOMAIN-tunnel.guardrail.lan}";
        WANT="${GUARDRAIL_HOST_IP:-}";
        addrs() { ip -4 -o addr show scope global 2>/dev/null | awk '$$2 !~ /^(docker[0-9]+|br-[0-9a-f]+)$$/ {split($$4,p,"/"); print $$2 "=" p[1]}' | tr '\n' ' '; };
        on_host() { ip -4 -o addr show 2>/dev/null | awk -v w="$$1" '{split($$4,p,"/"); if (p[1]==w) f=1} END{exit !f}'; };
        detect() { ip -4 route get 1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($$i=="src"){print $$(i+1); exit}}'; };
        IP=""; n=0;
        while [ "$$n" -lt 30 ]; do
        if [ -n "$$WANT" ]; then on_host "$$WANT" && IP="$$WANT";
        else IP=$$(detect); fi;
        [ -n "$$IP" ] && break;
        [ "$$n" = 0 ] && echo "guardrail-dns: waiting up to 60s for $${WANT:-an IPv4 default route} on this host...";
        n=$$((n+1)); sleep 2; done;
        if [ -z "$$IP" ]; then
        echo "guardrail-dns: refusing to start.";
        if [ -n "$$WANT" ]; then echo "  GUARDRAIL_HOST_IP=$$WANT is not an address on this host.";
        else echo "  GUARDRAIL_HOST_IP is unset and this host has no IPv4 default route."; fi;
        echo "  addresses here: $$(addrs)";
        echo "  fix: set GUARDRAIL_HOST_IP in the .env beside docker-compose.yml to one of those,";
        echo "       then: docker compose --profile dns up -d --force-recreate dns";
        sleep 30; exit 1; fi;
        if netstat -lnu 2>/dev/null | awk '{print $$4}' | grep -qE "^(0\.0\.0\.0|\[::\]|$$IP):53$$"; then
        echo "guardrail-dns: port 53 on $$IP is already served by something else on this host.";
        echo "  this host is already a DNS server (a directory server, Pi-hole, or systemd-resolved";
        echo "  configured to serve the LAN). dnsmasq cannot bind, so this container will keep failing.";
        echo "  the fix is one record on the resolver that already runs here: *.$$DOMAIN -> $$IP,";
        echo "  then re-run install.sh and answer no to the bundled resolver.";
        echo "  retrying in 20s in case that listener is on its way out...";
        sleep 20; fi;
        echo "guardrail-dns: *.$$DOMAIN -> $$IP (listening on $$IP:53, upstreams ${GUARDRAIL_DNS_UPSTREAM:-8.8.8.8} ${GUARDRAIL_DNS_UPSTREAM2:-1.1.1.1})";
        echo "guardrail-dns: your own records go in deploy/dns/ — see deploy/dns/README.md";
        exec dnsmasq --no-daemon --log-facility=-
        --bind-interfaces --listen-address=$$IP
        --no-resolv --server=${GUARDRAIL_DNS_UPSTREAM:-8.8.8.8} --server=${GUARDRAIL_DNS_UPSTREAM2:-1.1.1.1}
        --address=/$$DOMAIN/$$IP
        --hostsdir=/etc/guardrail/dns/hosts
        --conf-dir=/etc/guardrail/dns/conf.d,*.conf
    # Where an operator's OWN records live.
    #
    # The resolver used to answer exactly one thing — the tunnel wildcard, on the
    # command line — so adding a record to the estate meant editing this file,
    # and an update overwrote it. These two directories are on the host, survive
    # updates (install.sh merges the release over them and deletes nothing), and
    # split along the one distinction that matters in practice:
    #
    #   hosts/   A/AAAA records in /etc/hosts syntax. dnsmasq watches the
    #            directory with inotify, so an edit or a new file takes effect
    #            in about a second — no restart.
    #   conf.d/  full dnsmasq syntax for wildcards, CNAMEs, SRV and TXT. Read
    #            ONLY AT STARTUP: dnsmasq re-reads hosts files on the fly but
    #            never its own configuration, so these need a restart.
    #
    # MOUNTED ONE SUBDIRECTORY AT A TIME, not the parent. Docker creates a
    # missing bind-mount SOURCE, but only the path it was actually given — so
    # mounting ./deploy/dns alone left the host with an empty deploy/dns and no
    # hosts/ or conf.d/ inside it, and dnsmasq refused to start:
    #
    #   dnsmasq: cannot access directory /etc/guardrail/dns/conf.d: No such file
    #            or directory
    #
    # — in a restart loop, taking the resolver down with it. That is exactly the
    # state an update driven by an older install.sh produces, because that script
    # never fetched deploy/dns. Naming both paths makes Docker create both.
    volumes:
      - ./deploy/dns/hosts:/etc/guardrail/dns/hosts:ro
      - ./deploy/dns/conf.d:/etc/guardrail/dns/conf.d:ro
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Networks
#
# Everything used to share one implicit bridge. That put nine services on a flat
# network where the three most sensitive hops were unauthenticated, unencrypted,
# or both: guacd has no authentication of its own, Redis shipped with an empty
# password, and the Postgres DSN is sslmode=disable. Any container that could
# join that bridge could read the login-throttle keys, delete SSO replay nonces,
# capture the database password off a cleartext handshake, and drive guacd to
# connect anywhere with any credential.
#
# Three networks, and the api is the only thing on more than one — which is the
# point: it is the only component that legitimately needs to reach all three.
#
#   edge     traefik -> api, web. The public face.
#   data     api (+ the one-shot migrate/seed) -> postgres, redis.
#   session  api -> guacd.
#
# So web and traefik can no longer reach the database at all, and guacd cannot
# reach it either. The `dns` service is absent from all three deliberately: it
# runs with network_mode: host because dnsmasq binds a host address.
networks:
  edge:
    driver: bridge
  data:
    driver: bridge
  session:
    driver: bridge

volumes:
  # Persistent across `docker compose down` and reboots; `down -v` wipes them.
  #
  # These are the DEFAULT homes, used when the matching GUARDRAIL_*_MOUNT is
  # unset. Point one at an absolute path instead and the volume named here stops
  # being mounted anywhere — it is not deleted, and it still holds whatever it
  # held, which is why scripts/migrate-data.sh names it explicitly when it is
  # finally safe to remove.
  pgdata:
  redisdata:
  # Session recordings. These are audit evidence — back this up with pgdata, and
  # note that losing one without the other leaves sessions that reference video
  # that no longer exists.
  recordings:
  # Scratch space between guacd and the API: guacd writes a desktop recording
  # here, the API moves it into the blob store on teardown and deletes it. Nothing
  # here is durable evidence — that lives in `recordings` — so it needs no backup.
  #
  # Declared but never mounted: the two services share this through a bind mount
  # at GUARDRAIL_GUACD_RECORDING_DIR instead, for the reason spelled out on the
  # guacd service. Kept so that `docker volume ls` still accounts for the name.
  desktop-recordings:
